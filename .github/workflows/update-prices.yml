name: Update fuel prices

on:
  schedule:
    # Every day at 14:23 and 22:23 UTC (morning and evening in Canada).
    # NRCan publishes each day's average during the day, so the second run
    # picks up anything the first one missed.
    - cron: "23 14 * * *"
    - cron: "23 22 * * *"
  workflow_dispatch:
  push:
    branches: [claude/fuel-cost-calculator-kub0sf]
    paths: [scripts/update_prices.py, .github/workflows/update-prices.yml]

permissions:
  contents: write
  pages: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect city prices from Natural Resources Canada
        run: python scripts/update_prices.py

      - name: Save if prices changed
        run: |
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "Prices unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update fuel prices $(date -u +%F)"
          git push
          echo "PUSHED=1" >> "$GITHUB_ENV"

      # Pushes made by this workflow don't always start a GitHub Pages build,
      # so ask for one directly.
      - name: Rebuild the website
        if: env.PUSHED == '1' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the site will update on the next build."
